version: "3.8"

services:
  # ---------- Infraestructura de datos ----------
  mongodb:
    image: mongo:7.0
    container_name: banco-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongo-data:/data/db
    networks:
      - banco-net

  mongo-express:
    image: mongo-express:1.0
    container_name: banco-mongo-express
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    networks:
      - banco-net

  redis:
    image: redis:7.2-alpine
    container_name: banco-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - banco-net

  # Kafka en modo KRaft (sin Zookeeper), imagen oficial de Apache Kafka.
  # Un solo broker combinado (broker+controller) para desarrollo.
  kafka:
    image: apache/kafka:3.7.0
    container_name: banco-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - banco-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: banco-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: banco
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - banco-net

  # ---------- Infraestructura de plataforma ----------
  config-server:
    build: ./config-server
    container_name: banco-config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo
    networks:
      - banco-net

  ms-eureka:
    build: ./ms-eureka
    container_name: banco-ms-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - banco-net

  ms-gateway:
    build: ./ms-gateway
    container_name: banco-ms-gateway
    restart: unless-stopped
    depends_on:
      - ms-eureka
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://ms-eureka:8761/eureka/
      JWT_SECRET: cambia-esta-clave-super-secreta-de-al-menos-32-bytes-para-hmac256
    networks:
      - banco-net

  ms-auth:
    build: ./ms-auth
    container_name: banco-ms-auth
    restart: unless-stopped
    depends_on:
      - ms-eureka
    ports:
      - "8095:8095"
    environment:
      EUREKA_URI: http://ms-eureka:8761/eureka/
      JWT_SECRET: cambia-esta-clave-super-secreta-de-al-menos-32-bytes-para-hmac256
    networks:
      - banco-net

  # ---------- Microservicios de negocio ----------
  ms-customers:
    build: ./ms-customers
    container_name: banco-ms-customers
    restart: unless-stopped
    depends_on:
      - mongodb
      - config-server
      - ms-eureka
      - redis
    ports:
      - "8090:8090"
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/customers_db?authSource=admin
      EUREKA_URI: http://ms-eureka:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - banco-net

  ms-accounts:
    build: ./ms-accounts
    container_name: banco-ms-accounts
    restart: unless-stopped
    depends_on:
      - mongodb
      - config-server
      - ms-eureka
      - ms-customers
      - kafka
    ports:
      - "8091:8091"
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/accounts_db?authSource=admin
      EUREKA_URI: http://ms-eureka:8761/eureka/
      CUSTOMERS_URL: http://ms-customers
      CREDITS_URL: http://ms-credits
      KAFKA_BROKERS: kafka:9092
    networks:
      - banco-net

  ms-credits:
    build: ./ms-credits
    container_name: banco-ms-credits
    restart: unless-stopped
    depends_on:
      - mongodb
      - config-server
      - ms-eureka
      - ms-customers
      - kafka
    ports:
      - "8092:8092"
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/credits_db?authSource=admin
      EUREKA_URI: http://ms-eureka:8761/eureka/
      CUSTOMERS_URL: http://ms-customers
      KAFKA_BROKERS: kafka:9092
    networks:
      - banco-net

  ms-yanki:
    build: ./ms-yanki
    container_name: banco-ms-yanki
    restart: unless-stopped
    depends_on:
      - mongodb
      - config-server
      - ms-eureka
      - ms-accounts
    ports:
      - "8093:8093"
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/yanki_db?authSource=admin
      EUREKA_URI: http://ms-eureka:8761/eureka/
      ACCOUNTS_URL: http://ms-accounts
    networks:
      - banco-net

  ms-notifications:
    build: ./ms-notifications
    container_name: banco-ms-notifications
    restart: unless-stopped
    depends_on:
      - ms-eureka
      - kafka
    ports:
      - "8096:8096"
    environment:
      EUREKA_URI: http://ms-eureka:8761/eureka/
      KAFKA_BROKERS: kafka:9092
    networks:
      - banco-net

networks:
  banco-net:
    driver: bridge

volumes:
  mongo-data:
