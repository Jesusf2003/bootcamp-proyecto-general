server:
  port: 8091

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://admin:admin123@localhost:27017/accounts_db?authSource=admin}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 3

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

clients:
  customers:
    url: ${CUSTOMERS_URL:http://ms-customers}
  credits:
    url: ${CREDITS_URL:http://ms-credits}

# Circuit breaker (Resilience4j) para las llamadas salientes de este
# microservicio hacia ms-customers y ms-credits. Timeout de 2s exigido
# por el enunciado de la Parte II.
resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 2s
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
    instances:
      customersClient:
        base-config: default
      creditsClient:
        base-config: default

logging:
  level:
    root: INFO
    com.banco.accounts: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
